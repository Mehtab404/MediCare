# Render Blueprint: one Postgres database and one web service (API + built frontend).
# Deploy with Render Dashboard > New > Blueprint, and pick this repository.
databases:
  - name: medicare-db
    # Free databases are deleted 30 days after creation (after a 14 day grace period) and have no backups.
    # Fine for a trial. Move to a paid plan before real patient data goes in.
    plan: free
    databaseName: medicare
    user: medicare

services:
  - type: web
    name: medicare
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: DATABASE_URL
        fromDatabase:
          name: medicare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # First admin account, created on start if missing. Render asks for the password when you deploy.
      - key: ADMIN_USER_ID
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
